# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jastip
      POSTGRES_PASSWORD: jastip
      POSTGRES_DB: jastip
    ports:
      - "5432:5432"
    volumes:
      - jastip-db:/var/lib/postgresql/data
volumes:
  jastip-db:
